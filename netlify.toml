# O Git não publica este site. Os workflows do GitHub Actions fazem o build e o deploy.
[build]
command = "pnpm build"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "https://www.adrielliflores.com.br/*"
  to = "https://adrielliflores.com.br/:splat"
  status = 301
  force = true
