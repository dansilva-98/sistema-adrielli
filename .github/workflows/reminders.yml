name: Lembretes da agenda

on:
  workflow_dispatch:
    inputs:
      destino:
        description: Destino
        required: true
        type: choice
        default: production
        options:
          - production
          - staging

concurrency:
  group: reminders-${{ inputs.destino }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  production:
    if: github.event_name == 'workflow_dispatch' && inputs.destino == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: lembretes
    steps:
      - name: Descobrir versão publicada
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow production.yml --branch main --event workflow_dispatch --status success --limit 1 --json headSha --jq '.[0].headSha')
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SHA publicado inválido"
            exit 1
          fi
          echo "sha=$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.versao.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Enviar lembretes
        run: node --experimental-strip-types scripts/send-reminders.ts
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_ENV: production
  staging:
    if: github.event_name == 'workflow_dispatch' && inputs.destino == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Enviar lembretes
        run: node --experimental-strip-types scripts/send-reminders.ts
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_ENV: staging
