name: Backup de produção

on:
  schedule:
    # 06:15 UTC = 03:15 em America/Sao_Paulo, o ano todo.
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: production-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: backup
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Instalar age
        run: |
          set -euo pipefail
          version="1.3.2"
          file="age-v${version}-linux-amd64.tar.gz"
          url="https://github.com/FiloSottile/age/releases/download/v${version}/${file}"
          checksum="cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10"
          curl -fsSL -o "$file" "$url"
          echo "${checksum}  ${file}" | sha256sum -c -
          tar -xzf "$file"
          sudo install -m 0755 "age/age" /usr/local/bin/age
          rm -f "$file"
          age --version
      - name: Instalar cliente do Postgres
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Gerar e enviar o backup criptografado
        run: node scripts/production-backup.mjs
        env:
          BACKUP_CONFIRM: production
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          BACKUP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_DRIVE_CLIENT_ID: ${{ secrets.BACKUP_DRIVE_CLIENT_ID }}
          BACKUP_DRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_DRIVE_CLIENT_SECRET }}
          BACKUP_DRIVE_REFRESH_TOKEN: ${{ secrets.BACKUP_DRIVE_REFRESH_TOKEN }}
          BACKUP_DRIVE_FOLDER_ID: ${{ secrets.BACKUP_DRIVE_FOLDER_ID }}
