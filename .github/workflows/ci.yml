name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Subir Supabase local
        run: supabase start
      - name: Escrever ambiente local
        run: node scripts/write-local-env.mjs
      - name: Lint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes de unidade
        run: pnpm test
      - name: Migrations
        run: pnpm db:migrate
      - name: Carregar alinhamento da senha local
        run: node --experimental-strip-types src/db/sync-app-runtime-password.ts
      - name: Carregar seed
        run: pnpm db:seed
      - name: Carregar cabeçalhos estáticos
        run: |
          node --experimental-strip-types scripts/netlify-headers.ts
          rm -f public/_headers
        env:
          APP_ENV: staging
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SENTRY_DSN: https://public@o0.ingest.sentry.io/0
          NEXT_PUBLIC_SENTRY_DSN: https://public@o0.ingest.sentry.io/0
      - name: Bootstrap do primeiro administrador
        env:
          BOOTSTRAP_EMAIL: ci-primeiro-admin@example.com
        run: |
          set -euo pipefail
          echo "::add-mask::$BOOTSTRAP_EMAIL"
          trap 'node --experimental-strip-types scripts/remove-local-bootstrap-user.ts' EXIT
          code=0
          first=$(pnpm --silent admin:bootstrap -- --email "$BOOTSTRAP_EMAIL" 2>&1) || code=$?
          if printf '%s' "$first" | grep -F -q -- "$BOOTSTRAP_EMAIL"; then
            echo "o e-mail apareceu na saida"
            exit 1
          fi
          printf '%s\n' "$first"
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          if ! printf '%s\n' "$first" | grep -F -q "SUPER_ADMIN criado."; then
            echo "a primeira execucao nao criou o SUPER_ADMIN"
            exit 1
          fi
          code=0
          second=$(pnpm --silent admin:bootstrap -- --email "$BOOTSTRAP_EMAIL" 2>&1) || code=$?
          if printf '%s' "$second" | grep -F -q -- "$BOOTSTRAP_EMAIL"; then
            echo "o e-mail apareceu na saida"
            exit 1
          fi
          printf '%s\n' "$second"
          if [ "$code" -eq 0 ] || ! printf '%s\n' "$second" | grep -F -q "Recusado: já existe um SUPER_ADMIN."; then
            echo "a segunda execucao deveria ser recusada"
            exit 1
          fi
      - name: Histórico do Drizzle sem divergência
        run: |
          pnpm db:generate
          changes=$(git status --porcelain src/db/migrations)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- src/db/migrations
            exit 1
          fi
      - name: Testes de integração
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: Varrer segredo no bundle
        run: pnpm check:bundle
      - name: Instalar navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Site com banco vazio
        run: pnpm exec playwright test tests/e2e/empty-site.spec.ts
        env:
          EMPTY_SITE: "1"
      - name: Teste de fumaça
        run: pnpm test:e2e
      - name: Build sem banco
        run: pnpm build
        env:
          DATABASE_URL: postgresql://127.0.0.1:9/inexistente
      - name: Build com banco que não responde
        run: pnpm build
        env:
          DATABASE_URL: postgresql://u:p@10.255.255.1:5432/x
