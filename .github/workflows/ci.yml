name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Subir Supabase local
        run: supabase start
      - name: Escrever ambiente local
        run: node scripts/write-local-env.mjs
      - name: Lint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes de unidade
        run: pnpm test
      - name: Migrations
        run: pnpm db:migrate
      - name: Histórico do Drizzle sem divergência
        run: |
          pnpm db:generate
          changes=$(git status --porcelain src/db/migrations)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- src/db/migrations
            exit 1
          fi
      - name: Testes de integração
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: Varrer segredo no bundle
        run: pnpm check:bundle
      - name: Instalar navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Site com banco vazio
        run: pnpm exec playwright test tests/e2e/empty-site.spec.ts
        env:
          EMPTY_SITE: "1"
      - name: Teste de fumaça
        run: pnpm test:e2e
      - name: Build sem banco
        run: pnpm build
        env:
          DATABASE_URL: postgresql://127.0.0.1:9/inexistente
      - name: Build com banco que não responde
        run: pnpm build
        env:
          DATABASE_URL: postgresql://u:p@10.255.255.1:5432/x
