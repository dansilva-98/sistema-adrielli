<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pedidos</title>
    <style>
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        margin: 0;
        background: #f3f4f6;
        color: #111827;
        line-height: 1.5;
      }
      .grade {
        display: grid;
        grid-template-columns: 1fr;
        gap: 28px;
        padding: 48px 32px;
        max-width: 640px;
        margin: 0 auto;
      }
      aside {
        display: flex;
        gap: 12px;
      }
      .item {
        margin: 0 0 14px;
        padding: 14px 18px;
        background: #ffffff;
        border-radius: 10px;
      }
      .acao {
        font-family: inherit;
        font-size: 0.95rem;
        padding: 10px 18px;
        background: #ffffff;
        color: #111827;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        cursor: pointer;
      }
      #exportar {
        background: #111827;
        color: #ffffff;
        border-color: #111827;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 1.75rem;
        font-weight: 650;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
    </style>
  </head>
  <body>
    <main class="grade">
      <aside>
        <button class="acao" type="button" id="atualizar">Atualizar</button>
        <button class="acao" type="button" id="exportar">Exportar CSV</button>
      </aside>
      <section>
        <h1>Pedidos</h1>
        <ul id="itens">
          <li class="item" data-nome="Caderno" data-preco="12.50">Caderno — 12,50</li>
          <li class="item" data-nome="Caneta" data-preco="3.00">Caneta — 3,00</li>
        </ul>
      </section>
    </main>
    <script>
      function campoCsv(valor) {
        var texto = String(valor);
        if (/[",\r\n]/.test(texto)) {
          return '"' + texto.replace(/"/g, '""') + '"';
        }
        return texto;
      }

      document.getElementById("exportar").addEventListener("click", function () {
        var linhas = ["nome,preco"];
        document.querySelectorAll("#itens .item").forEach(function (item) {
          var nome = item.getAttribute("data-nome") || "";
          var preco = item.getAttribute("data-preco") || "";
          linhas.push(campoCsv(nome) + "," + campoCsv(preco));
        });
        var blob = new Blob(["\uFEFF" + linhas.join("\r\n")], {
          type: "text/csv;charset=utf-8",
        });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = "pedidos.csv";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>
